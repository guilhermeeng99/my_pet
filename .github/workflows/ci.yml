name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Stub firebase_options.dart
        run: |
          mkdir -p lib
          cat > lib/firebase_options.dart <<'DART'
          // CI stub. Real values are generated locally via flutterfire configure.
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              throw UnsupportedError('Firebase not configured in CI.');
            }
          }
          DART

      - name: Install dependencies
        run: flutter pub get

      - name: Generate i18n
        run: dart run slang

      - name: Generate code (Hive adapters, etc.)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  distribute-android:
    name: Build + Firebase App Distribution
    needs: analyze-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore lib/firebase_options.dart from secret
        env:
          FIREBASE_OPTIONS_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
        run: |
          mkdir -p lib
          printf '%s' "$FIREBASE_OPTIONS_B64" | base64 -d > lib/firebase_options.dart

      - name: Restore android/app/google-services.json from secret
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: printf '%s' "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Generate i18n
        run: dart run slang

      - name: Generate code (Hive adapters, etc.)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Read versionName from pubspec.yaml
        id: pubspec
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$VERSION_NAME, versionCode=${{ github.run_number }}"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.pubspec.outputs.version_name }} \
            --build-number=${{ github.run_number }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Distribute APK to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT_B64" | base64 -d > "$GOOGLE_APPLICATION_CREDENTIALS"
          RELEASE_NOTES="Build #${{ github.run_number }} — $(git log -1 --pretty=%s)"
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "$APP_ID" \
            --groups "$TESTER_GROUPS" \
            --release-notes "$RELEASE_NOTES"
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
